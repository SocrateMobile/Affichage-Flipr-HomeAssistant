#
# Ce code ESPHome pour LILYGO TTGO T-Display 1.14 Pouces LCD + ESP32 Module sans Fil
# Permet d'afficher les relevés de Flipr, en complément de l intégration: https://www.home-assistant.io/integrations/flipr/ 
# (ou d'une autre intégration HA qui remontrait les memes éléments) 
# doc et boitier imprimable en 3D : https://github.com/Xinyuan-LilyGO/TTGO-T-Display
# 
# Version 2.0 du code, qui apporte une lisibilité simple:
#      le statut pH et celui du Chlore,
#      la température de l'eau de la piscine,
#      le taux de chlore; et la valeur du pH 
#      j'aurais pu ajouter le redox, la date de la mesure, mais cela sera dans la v3, avec l'utilisation des Boutons ;-)

substitutions:
# Ici personalisez le nom de votre ESP:

  devicename: affichageflipr
  frendlyname: Affichage de Flipr

# Ici personalisez l'adresse IP fixe de votre ESP:
# ce n'est pas obligatoire, sauf si plus bas vous retirez les #

  ip_device: 192.168.1.1
  ip_gateway: 192.168.1.254
  ip_subnet:  255.255.255.0

# indiquez ici les sensors de votre Flipr: 

  entity1: sensor.flipr_XXXXXXXX_water_temperature
  entity2: sensor.flipr_XXXXXXXX_ph
  entity3: sensor.flipr_XXXXXXXX_chlorine
  
# indiquez ici les binary sensors de votre Flipr:

  entity4: binary_sensor.flipr_XXXXXXXX_chlorine_status
  entity5: binary_sensor.flipr_XXXXXXXX_ph_status
  entity6: sensor.flipr_XXXXXXXX_last_measured
  icon_signal: signal

# ici, réglage des valeurs pour la gestion des couleurs:
  temp_mini: "26"
  temp_maxi: "31"
  ph_mini: "7"
  ph_maxi: "7.4"
  chlore_mini: "0.5"
  chlore_maxi: "3"

#
# Dans le reste du code, tout est variabilisé sur les labels de substitution
#
esphome:
  name: ${devicename}

esp32:
  board: featheresp32
  framework:
    type: arduino

# Enable logging
logger:

api:
  encryption:
    key: !secret key_display_p

ota:
  - platform: esphome
    password: !secret ota_display_p

# Ici, on lance la connexion de l'ESP8266 à votre WIFI, 
# les paramètres sont à remplir plus haut, et dans le fichier secret.yaml
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#  manual_ip:
#    static_ip: ${ip_device}
#    gateway: ${ip_gateway}
#    subnet: ${ip_subnet}

# Ici, on active le serveur WEB du ESP8266, en allant sur l'IP du ESP8266, on tombe sur une interface pour piloter les relais
web_server:
  port: 80
  version: 3
  auth:
    type: basic
    username: !secret server_username
    password: !secret server_password

captive_portal:

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blanc
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%

image:
  - platform: file
    file: "images/alert.jpg"
    id: pb_logo
    resize: 50x50
    type: RGB

  - platform: file
    file: "images/check-circle.jpg"
    id: ok_logo
    resize: 50x50
    type: RGB

font:
  - file: "gfonts://Roboto"
    id: sfcompact_40
    size: 40
  - file: "gfonts://Roboto"
    id: sfcompact_37
    size: 37
  - file: "gfonts://Roboto"
    id: sfcompact_25
    size: 25

# ne pas oublier de mettre la font SFCompact.ttf dans le repertoir esphome de votre home assistant

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35
      inverted: true
    name: "${frendlyname} bouton du haut"
    id: tdisplay_button_input_1
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    id: tdisplay_button_input_0
    name: "${frendlyname} bouton du bas"
  - platform: status
    name: "Etat de l'afficheur"
    id: system_status
  - platform: homeassistant
    id: statut_chlore
    name: "Statut Chlore: "
    entity_id: ${entity4}
  - platform: homeassistant
    id: statut_ph
    name: "Statut pH: "
    entity_id: ${entity5}
    
switch:
#  - platform: template
#    name: "Switch Chlore"
#    id: "chlore"
#    lambda: |-
#      if (id(statut_chlore).state) {
#        return true;
#      } else {
#        return false;
#      }
#    turn_on_action:
#      - switch.turn_on: switch1
#    turn_off_action:
#      - switch.turn_off: switch1
#  - platform: gpio
#    pin: GPIO0 
#    name: "switch1"
#    id: "switch1"
    

sensor:
  - platform: homeassistant
    id: temp_eau
    name: "Température de l'eau:"
    entity_id: ${entity1}
    unit_of_measurement: '°C'
    state_class: measurement
  - platform: homeassistant
    id: niveau_ph
    name: "pH à : "
    entity_id: ${entity2}
    state_class: "measurement"
    accuracy_decimals: 2
    unit_of_measurement: "pH"
  - platform: homeassistant
    id: niveau_chlore
    name: "Niveau de Chlore à "
    entity_id: ${entity3}
    unit_of_measurement: 'ppm'
    state_class: measurement
    accuracy_decimals: 2
  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
  - platform: uptime
    name: "En ligne depuis"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Addresse IP"
      icon: "mdi:network-outline"
    ssid:
      name: "SSID :"
      icon: "mdi:${icon_signal}"
    bssid:
      name: "BSSID :"   
      icon: "mdi:${icon_signal}"
  - platform: homeassistant
    id: derniere_analyse
    name: "Dernière analyse"
    entity_id: ${entity6}

time:
  - platform: homeassistant
    id: esptime

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

display:
  - platform: st7789v
    model: TTGO TDisplay 135x240
    backlight_pin: GPIO4
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 90
    lambda: |-
      bool statutchlore = statut_chlore->state;
      bool statutph = statut_ph->state;
      float eautemp = id(temp_eau).state;
      float chloreniveau = id(niveau_chlore).state;
      float phniveau = id(niveau_ph).state;

      it.print(0, 0, id(sfcompact_25), id(my_blanc), TextAlign::TOP_LEFT, "Chlore    pH     Temp");
      it.line(0, 88, 149, 88);
      it.line(85, 0, 85, 135);
      it.line(149, 0, 149, 135);

      if (isnan(eautemp)) {
        it.printf(150, 35, id(sfcompact_40), id(my_yellow), TextAlign::TOP_LEFT, "--.-");
        it.print(180, 90, id(sfcompact_40), id(my_yellow), TextAlign::TOP_LEFT, "°C");
      }
      else if (eautemp < ${temp_mini}) {
        it.printf(150, 35, id(sfcompact_40), id(my_yellow), TextAlign::TOP_LEFT, "%.1f", eautemp);
        it.print(180, 90, id(sfcompact_40), id(my_yellow), TextAlign::TOP_LEFT, "°C");
      }
      else if (eautemp > ${temp_maxi}) {
        it.printf(150, 35, id(sfcompact_40), id(my_red), TextAlign::TOP_LEFT, "%.1f", eautemp);
        it.print(180, 90, id(sfcompact_40), id(my_red), TextAlign::TOP_LEFT, "°C");
      }
      else {
        it.printf(150, 35, id(sfcompact_40), id(my_green), TextAlign::TOP_LEFT, "%.1f", eautemp);
        it.print(180, 90, id(sfcompact_40), id(my_green), TextAlign::TOP_LEFT, "°C");
      }

      if (isnan(chloreniveau)) {
        it.printf(0, 90, id(sfcompact_40), id(my_yellow), TextAlign::TOP_LEFT, "--.-");
      }
      else if (chloreniveau < ${chlore_mini}) {
        it.printf(0, 90, id(sfcompact_40), id(my_red), TextAlign::TOP_LEFT, "%.1f", chloreniveau);
      }
      else if (chloreniveau > ${chlore_maxi}) {
        it.printf(0, 90, id(sfcompact_40), id(my_yellow), TextAlign::TOP_LEFT, "%.1f", chloreniveau);
      }
      else {
        it.printf(0, 90, id(sfcompact_40), id(my_green), TextAlign::TOP_LEFT, "%.1f", chloreniveau);
      }

      if (isnan(phniveau)) {
        it.printf(88, 90, id(sfcompact_37), id(my_yellow), TextAlign::TOP_LEFT, "--.-");
      }
      else if (phniveau > ${ph_maxi} || phniveau < ${ph_mini}) {
        it.printf(88, 90, id(sfcompact_37), id(my_red), TextAlign::TOP_LEFT, "%.1f", phniveau);
      }
      else {
        it.printf(88, 90, id(sfcompact_37), id(my_green), TextAlign::TOP_LEFT, "%.1f", phniveau);
      }

      if (statutchlore) {
        it.image(15, 33, id(pb_logo));
      }
      else {
        it.image(15, 33, id(ok_logo));
      }

      if (statutph) {
        it.image(92, 33, id(pb_logo));
      }
      else {
        it.image(92, 33, id(ok_logo));
      }
